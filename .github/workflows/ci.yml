name: CI

on:
  push:
    branches: [main, development]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
        env:
          # The app validates env at boot (src/env.ts); skip that for a
          # secret-less CI build. Dummy values still satisfy the few modules
          # that read process.env at import time (e.g. the production Turnstile
          # secret guard in src/lib/auth.ts).
          SKIP_ENV_VALIDATION: "1"
          DATABASE_URL: postgres://ci:ci@localhost:5432/ci
          BETTER_AUTH_SECRET: ci-dummy-secret-not-used
          BETTER_AUTH_URL: http://localhost:3000
          SMTP_HOST: localhost
          SMTP_PORT: "587"
          SMTP_USER: ci
          SMTP_PASSWORD: ci
          EMAIL_FROM: ci@example.com
          TURNSTILE_SECRET_KEY: 1x0000000000000000000000000000000AA
          NEXT_PUBLIC_ALLOW_SIGNUP: "true"
